<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e8eef2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Cosori Direkt-Reader</title>
<style>
  :root {
    --bg:#e8eef2; --surface:#f8fafb; --ink:#13232f; --muted:#5d7080; --line:#cfdae2;
    --core:#d4381d; --core-soft:#f6d9d2; --amb:#1d6b86; --ok:#2f8a57; --warn:#b7791f;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1a22; --surface:#172530; --ink:#e9f0f4; --muted:#8ea3b2; --line:#26394a;
            --core:#ff6a4d; --core-soft:#3a2420; --amb:#5fc0df; --ok:#4cc386; --warn:#e3b04b; }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; background:var(--bg); color:var(--ink); }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; min-height:100dvh;
         padding: env(safe-area-inset-top) 0 0; }
  main { max-width:520px; margin:0 auto; padding:14px 14px 0; display:flex; flex-direction:column; gap:12px; }
  header { display:flex; align-items:center; justify-content:space-between; }
  h1 { font-size:18px; font-weight:650; margin:0; letter-spacing:.2px; }
  .chip { display:flex; align-items:center; gap:8px; padding:7px 12px; border-radius:99px; background:var(--surface);
          border:1px solid var(--line); font-size:13px; color:var(--muted); max-width:70%; }
  .chip span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #dot { width:9px; height:9px; border-radius:50%; background:var(--muted); flex:none; }
  #dot.on { background:var(--ok); } #dot.busy { background:var(--warn); } #dot.err { background:var(--core); }

  .card { background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:18px; }
  .label { font-size:13px; color:var(--muted); margin:0; }
  .hero { padding:20px 18px 16px; transition:background .3s, border-color .3s; }
  .hero.hot { background:var(--core-soft); border-color:var(--core); }
  .hero.alarm { animation:blink .9s ease-in-out infinite; }
  @keyframes blink {
    0%, 100% { box-shadow:0 0 0 0 transparent; border-color:var(--line); }
    50%      { box-shadow:0 0 0 6px var(--core); border-color:var(--core); }
  }
  @media (prefers-reduced-motion: reduce) { .hero.alarm { animation:none; box-shadow:0 0 0 6px var(--core); } }
  #stopAlarm { margin-top:16px; width:100%; padding:14px; border:0; border-radius:14px; background:var(--core); color:#fff; font-size:16px; font-weight:680; }
  .small { padding:9px 12px; margin-top:10px; font-size:13px; }
  .big { display:flex; align-items:baseline; gap:6px; margin:4px 0 16px; line-height:1; }
  #core { font-size:clamp(68px, 24vw, 112px); font-weight:720; font-variant-numeric:tabular-nums; letter-spacing:-2px; color:var(--core); }
  .big small { font-size:26px; font-weight:560; color:var(--muted); }
  .pill { display:inline-block; margin:0 0 16px; padding:6px 14px; border-radius:99px; font-size:15px; font-weight:650;
          background:var(--line); color:var(--ink); transition:background .3s; }
  .gauge { position:relative; height:18px; margin:6px 0 0; }
  #bands { position:absolute; inset:0; border-radius:99px; overflow:hidden; background:var(--line);
           outline:1px solid color-mix(in srgb, var(--ink) 28%, transparent); outline-offset:0; }
  #bands i { position:absolute; top:0; bottom:0; box-shadow:inset 2px 0 0 var(--surface); }
  #mark { position:absolute; top:-5px; width:3px; height:28px; border-radius:2px; background:var(--ink); left:60%; transform:translateX(-1px); transition:left .2s; opacity:.8; }
  #needle { position:absolute; top:50%; width:26px; height:26px; margin:-13px 0 0 -13px; border-radius:50%; background:#fff;
            border:4px solid var(--core); box-shadow:0 1px 4px rgba(0,0,0,.35); left:0; transition:left .5s ease; }
  .scale { display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-top:10px; }
  .stages { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:6px; margin-top:14px; }
  .stages div { display:flex; align-items:center; gap:5px; font-size:clamp(10px, 3vw, 13px); line-height:1.2; min-width:0; }
  .stages i { width:12px; height:12px; border-radius:4px; flex:none; outline:1px solid color-mix(in srgb, var(--ink) 28%, transparent); }
  .stages p { min-width:0; }
  .stages b { display:block; font-weight:650; }
  .stages span { color:var(--muted); }

  .herohead { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  .eta { text-align:right; }
  .eta b { display:block; margin-top:2px; font-size:20px; font-weight:680; font-variant-numeric:tabular-nums; }
  #pick { display:block; width:100%; margin-top:6px; padding:12px; border:0; background:transparent; color:var(--muted); font-size:14px; font-weight:600; text-decoration:underline; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .val { font-size:34px; font-weight:680; font-variant-numeric:tabular-nums; margin-top:6px; }
  #amb { color:var(--amb); }
  .stepper { display:flex; align-items:center; justify-content:space-between; margin-top:6px; }
  .stepper b { font-size:34px; font-weight:680; font-variant-numeric:tabular-nums; }
  .stepper button { width:44px; height:44px; border-radius:50%; border:1px solid var(--line); background:var(--bg);
                    color:var(--ink); font-size:22px; line-height:1; }
  .stepper button:active { background:var(--line); }

  #chart { width:100%; height:auto; display:block; margin-top:8px; }
  details summary { cursor:pointer; font-size:15px; font-weight:600; list-style:none; display:flex; justify-content:space-between; }
  details summary::after { content:"▾"; color:var(--muted); }
  details[open] summary::after { content:"▴"; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px; }
  .grid div { background:var(--bg); border-radius:12px; padding:10px 12px; }
  .grid .k { font-size:12px; color:var(--muted); }
  .grid .v { font-size:17px; font-weight:620; font-variant-numeric:tabular-nums; margin-top:2px; }
  .offs { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
  .offs label { font-size:12px; color:var(--muted); display:flex; flex-direction:column; gap:4px; }
  .offs input { font-size:17px; padding:9px 12px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--ink); width:100%; }
  #bytes { display:flex; flex-wrap:wrap; gap:4px; margin-top:14px; font-family:ui-monospace, Menlo, monospace; font-size:13px; }
  #bytes span { padding:3px 5px; border-radius:6px; background:var(--bg); color:var(--muted); }
  #bytes .c { background:var(--core); color:#fff; } #bytes .a { background:var(--amb); color:#fff; }
  .legend { font-size:12px; color:var(--muted); margin:8px 0 0; }
  .ghost { margin-top:12px; width:100%; padding:12px; border-radius:12px; border:1px solid var(--line); background:transparent; color:var(--ink); font-size:15px; font-weight:600; }

  .bar { position:sticky; bottom:0; padding:10px 0 calc(10px + env(safe-area-inset-bottom)); margin-top:auto;
         background:linear-gradient(to top, var(--bg) 70%, transparent); }
  .bar:has(#connect[hidden]) { display:none; }
  #connect { width:100%; padding:17px; border:0; border-radius:16px; background:var(--core); color:#fff; font-size:17px; font-weight:680; }
  #connect:active { filter:brightness(.9); }
  .spacer { height:8px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Cosori Direkt-Reader</h1>
    <div class="chip"><i id="dot"></i><span id="status">Getrennt</span></div>
  </header>

  <section class="card hero" id="hero">
    <div class="herohead"><p class="label">Kerntemperatur (Spitze)</p><div class="eta"><p class="label">Restdauer</p><b id="eta">–</b></div></div>
    <div class="big"><span id="core">––,–</span><small>°C</small></div>
    <div class="pill" id="stage">Noch keine Messung</div>
    <div class="gauge"><div id="bands"></div><div id="mark"></div><div id="needle"></div></div>
    <div class="scale"><span>30</span><span>60</span><span>90 °C</span></div>
    <div class="stages" id="stages"></div>
    <button id="stopAlarm" hidden>Alarm stoppen</button>
  </section>

  <section class="two">
    <div class="card"><p class="label">Griff / Umgebung</p><div class="val"><span id="amb">––,–</span> °C</div></div>
    <div class="card"><p class="label">Zieltemperatur</p>
      <div class="stepper"><button id="minus" aria-label="Ziel senken">−</button><b id="target">60</b><button id="plus" aria-label="Ziel erhöhen">+</button></div>
      <button class="ghost small" id="soundBtn" aria-pressed="true">Ton bei Alarm: an</button>
    </div>
  </section>

  <section class="card">
    <p class="label">Verlauf der letzten 10 Minuten</p>
    <svg id="chart" viewBox="0 0 320 120" role="img" aria-label="Temperaturverlauf"></svg>
  </section>

  <section class="card">
    <details open>
      <summary>Debug</summary>
      <div class="grid">
        <div><div class="k">Rohwert Kern</div><div class="v" id="rc">–</div></div>
        <div><div class="k">Rohwert Griff</div><div class="v" id="ra">–</div></div>
        <div><div class="k">Paketlänge</div><div class="v" id="len">–</div></div>
        <div><div class="k">Pakete</div><div class="v" id="cnt">0</div></div>
      </div>
      <div class="offs">
        <label>Byte-Position Kern<input id="offC" type="number" inputmode="numeric" min="0" max="60" value="21"></label>
        <label>Byte-Position Griff<input id="offA" type="number" inputmode="numeric" min="0" max="60" value="23"></label>
      </div>
      <div id="bytes"></div>
      <p class="legend"><b style="color:var(--core)">Rot</b> = Kern, <b style="color:var(--amb)">Blau</b> = Griff (je 2 Bytes, Little Endian)</p>
      <button class="ghost" id="copyLog">Messprotokoll kopieren</button>
    </details>
  </section>

  <div class="bar"><button id="connect">Verbinden</button><button id="pick" hidden>Anderes Gerät wählen</button></div>
</main>

<script>
const SERVICE_UUID = 0xfff0, CHAR_UUID = 0xfff1;
// Kennlinie je Fühler als NTC-Modell: Rohwert = N / (1 + k * exp(B * (1/T - 1/298,15))) + d   (T in Kelvin)
// Gemessene Stützpunkte (23.11.2026): Eiswasser 0 °C, Raumtemperatur 24 °C (Spitze 721, Griff 739), 0 °C = Spitze 320, Griff 345.
// Der Wert bei 100 °C (Spitze 2082) stammt noch aus der alten Tabelle und ist ungeprüft. Der Griff nimmt dieselbe Schaltung wie die Spitze an.
const NTC_CORE = { N: 2615.20, k: 2.52837, B: 3396.62, d: 0 };
const NTC_AMB  = { N: 2615.20, k: 2.60288, B: 3396.62, d: 33.067 };
const WINDOW_MS = 10 * 60 * 1000;
const ETA_WINDOW = 3 * 60 * 1000;   // Zeitfenster für die Restdauer-Schätzung
// Garstufen (Rind, Kerntemperatur). Farben und Grenzen hier anpassen.
const SCALE_MIN = 30, SCALE_MAX = 90;
const STAGES = [
  { name: 'Englisch',    from: 48, to: 52,       color: '#f6e27a', text: '#13232f' },
  { name: 'Medium Rare', from: 52, to: 57,       color: '#a6dc96', text: '#13232f' },
  { name: 'Medium',      from: 57, to: 63,       color: '#2a7a4b', text: '#ffffff' },
  { name: 'Well Done',   from: 70, to: Infinity, color: null }
];
// Roter Verlauf im hohen Bereich (Spitze bei Well Done), gleich lang wie der gelbe
const HOT = { at: 70, color: '#e0442b' };
const pos = t => (Math.max(SCALE_MIN, Math.min(SCALE_MAX, t)) - SCALE_MIN) / (SCALE_MAX - SCALE_MIN) * 100;
function stageOf(c) {
  const s = STAGES.find(x => c >= x.from && c < x.to);
  if (s) return { label: s.name, color: s.color, text: s.text };
  if (c < STAGES[0].from) return { label: 'Unter Englisch', color: null };
  if (c >= 63 && c < 70) return { label: 'Medium Well', color: null };
  return { label: '', color: null };
}
function buildStages() {
  const cs = STAGES.filter(s => s.color), mid = s => (s.from + s.to) / 2, FADE = 5;
  const stops = ['var(--line) 0%', `var(--line) ${pos(mid(cs[0]) - FADE)}%`]
    .concat(cs.map(s => `${s.color} ${pos(mid(s))}%`))
    .concat([`${HOT.color} ${pos(HOT.at)}%`, `var(--line) ${pos(HOT.at + FADE)}%`, 'var(--line) 100%']);
  $('bands').style.background = `linear-gradient(to right, ${stops.join(', ')})`;
  $('stages').innerHTML = STAGES.filter(s => s.color).map(s => `<div><i style="background:${s.color || 'var(--line)'}"></i><p style="margin:0"><b>${s.name}</b><span>${s.from}${isFinite(s.to) ? '–' + s.to : '+'} °C</span></p></div>`).join('');
}
function showStage(c) {
  const r = stageOf(c), el = $('stage');
  el.textContent = r.label; el.style.display = r.label ? '' : 'none';
  el.style.background = r.color || ''; el.style.color = r.text || '';
}

const $ = id => document.getElementById(id);
const st = { target: 60, hist: [], log: [], n: 0, alarmed: false, sound: true, ringTimer: null, ctx: null, tries: 0, dev: null };
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : +v; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} }
};
const fmt = x => x.toFixed(1).replace('.', ',');

function toCelsius(raw, m) {
  const x = m.N / (raw - m.d) - 1;
  if (!(x > 0)) return 150;                       // Rohwert über dem Messbereich
  const T = 1 / (1 / 298.15 + Math.log(x / m.k) / m.B) - 273.15;
  return Math.max(-40, Math.min(150, T));
}
function setStatus(text, kind) { $('status').textContent = text; $('dot').className = kind || ''; }

function beep() {
  if (!st.ctx) return;
  [0, .35, .7].forEach(d => {
    const o = st.ctx.createOscillator(), g = st.ctx.createGain();
    o.frequency.value = 880; g.gain.value = .25;
    o.connect(g); g.connect(st.ctx.destination);
    o.start(st.ctx.currentTime + d); o.stop(st.ctx.currentTime + d + .2);
  });
}
function startAlarm() {
  st.alarmed = true;
  $('hero').classList.add('alarm'); $('stopAlarm').hidden = false;
  const ring = () => { navigator.vibrate && navigator.vibrate([300, 150, 300]); if (st.sound) beep(); };
  ring(); clearInterval(st.ringTimer); st.ringTimer = setInterval(ring, 3000);
}
function stopAlarm() {
  clearInterval(st.ringTimer); st.ringTimer = null;
  $('hero').classList.remove('alarm'); $('stopAlarm').hidden = true;
}
function setSound(on, preview) {
  st.sound = on; store.set('sound', on ? 1 : 0);
  $('soundBtn').textContent = 'Ton bei Alarm: ' + (on ? 'an' : 'aus'); $('soundBtn').setAttribute('aria-pressed', on);
  if (on && preview) beep();
}
function setTarget(v) {
  st.target = Math.max(30, Math.min(100, v)); store.set('target', st.target);
  $('target').textContent = st.target; $('mark').style.left = pos(st.target) + '%'; st.alarmed = false; stopAlarm(); updateEta();
}

function drawChart() {
  const svg = $('chart'), now = Date.now(), pts = st.hist.filter(p => now - p.t <= WINDOW_MS);
  if (pts.length < 2) { svg.innerHTML = '<text x="160" y="64" text-anchor="middle" fill="var(--muted)" font-size="13">Warte auf Messwerte …</text>'; return; }
  const vals = pts.flatMap(p => [p.c, p.a]).concat(st.target);
  let lo = Math.min(...vals) - 2, hi = Math.max(...vals) + 2;
  if (hi - lo < 15) hi = lo + 15;
  const X = t => 8 + (312 - 8) * (t - (now - WINDOW_MS)) / WINDOW_MS, Y = v => 112 - 104 * (v - lo) / (hi - lo);
  const path = k => pts.map((p, i) => (i ? 'L' : 'M') + X(p.t).toFixed(1) + ' ' + Y(p[k]).toFixed(1)).join('');
  svg.innerHTML =
    `<line x1="8" x2="312" y1="${Y(st.target)}" y2="${Y(st.target)}" stroke="var(--ink)" stroke-dasharray="4 4" opacity=".45"/>` +
    `<path d="${path('a')}" fill="none" stroke="var(--amb)" stroke-width="2" stroke-linejoin="round"/>` +
    `<path d="${path('c')}" fill="none" stroke="var(--core)" stroke-width="3" stroke-linejoin="round"/>` +
    `<text x="8" y="12" fill="var(--muted)" font-size="11">${hi.toFixed(0)} °C</text>` +
    `<text x="8" y="116" fill="var(--muted)" font-size="11">${lo.toFixed(0)} °C</text>`;
}

function onData(e) {
  const v = e.target.value, bytes = new Uint8Array(v.buffer, v.byteOffset, v.byteLength);
  const oc = +$('offC').value, oa = +$('offA').value;
  st.n++; $('cnt').textContent = st.n; $('len').textContent = v.byteLength + ' Bytes';
  $('bytes').innerHTML = Array.from(bytes).map((b, i) => {
    const cls = (i === oc || i === oc + 1) ? 'c' : (i === oa || i === oa + 1) ? 'a' : '';
    return `<span class="${cls}" title="Byte ${i}">${b.toString(16).padStart(2, '0')}</span>`;
  }).join('');
  if (v.byteLength < Math.max(oc, oa) + 2) { $('rc').textContent = $('ra').textContent = 'zu kurz'; return; }
  const rc = v.getUint16(oc, true), ra = v.getUint16(oa, true), c = toCelsius(rc, NTC_CORE), a = toCelsius(ra, NTC_AMB);
  $('rc').textContent = rc + ' (0x' + rc.toString(16) + ')';
  $('ra').textContent = ra + ' (0x' + ra.toString(16) + ')';
  $('core').textContent = fmt(c); $('amb').textContent = fmt(a);
  $('needle').style.left = pos(c) + '%'; showStage(c);
  const now = Date.now(); st.hist.push({ t: now, c, a });
  if (st.hist.length > 4000) st.hist.splice(0, 500);
  if (st.log.length < 8000) st.log.push([new Date(now).toISOString(), rc, ra, c.toFixed(1), a.toFixed(1), Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join('')].join(';'));
  const hot = c >= st.target; $('hero').classList.toggle('hot', hot);
  if (hot && !st.alarmed) startAlarm();
  if (c < st.target - 1) { st.alarmed = false; stopAlarm(); }
  drawChart(); updateEta();
}

function fmtDur(min) {
  if (min < 1) return 'unter 1 min';
  const m = Math.round(min);
  return m < 60 ? 'ca. ' + m + ' min' : 'ca. ' + Math.floor(m / 60) + ' h ' + String(m % 60).padStart(2, '0') + ' min';
}
function updateEta() {
  const el = $('eta'), now = Date.now(), pts = st.hist.filter(p => now - p.t <= ETA_WINDOW);
  const last = pts[pts.length - 1];
  if (!last || now - last.t > 20000) { el.textContent = '–'; return; }
  if (last.c >= st.target) { el.textContent = 'Ziel erreicht'; return; }
  if (pts.length < 5 || last.t - pts[0].t < 60000) { el.textContent = 'berechne …'; return; }
  const t0 = pts[0].t, n = pts.length;
  let sx = 0, sy = 0, sxx = 0, sxy = 0;
  for (const p of pts) { const x = (p.t - t0) / 60000; sx += x; sy += p.c; sxx += x * x; sxy += x * p.c; }
  const d = n * sxx - sx * sx, slope = d ? (n * sxy - sx * sy) / d : 0;   // °C pro Minute
  const min = slope >= 0.05 ? (st.target - last.c) / slope : Infinity;
  el.textContent = min > 600 ? '–' : fmtDur(min);
}

const seen = new WeakSet();
let abortWait = null;
const sget = k => { try { return localStorage.getItem(k); } catch { return null; } };
const sset = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
function updatePick() { $('pick').hidden = !sget('devName'); }
function showConnect() { $('connect').hidden = false; $('connect').textContent = 'Verbinden'; updatePick(); }

async function attach(dev) {
  st.dev = dev; sset('devId', dev.id); sset('devName', dev.name || ''); updatePick();
  if (!seen.has(dev)) { seen.add(dev); dev.addEventListener('gattserverdisconnected', onLost); }
  setStatus('Verbinde mit ' + (dev.name || 'Gerät') + ' …', 'busy');
  const server = await dev.gatt.connect();
  const ch = await (await server.getPrimaryService(SERVICE_UUID)).getCharacteristic(CHAR_UUID);
  ch.addEventListener('characteristicvaluechanged', onData);
  await ch.startNotifications();
  st.tries = 0;
  setStatus('Verbunden · ' + (dev.name || 'Gerät'), 'on'); $('connect').hidden = true;
  try { await navigator.wakeLock.request('screen'); } catch {}
}
function onLost(e) { setStatus('Verbindung verloren – verbinde neu …', 'busy'); showConnect(); retry(e.target); }
async function retry(dev) {
  try { await attach(dev); }
  catch (err) {
    console.warn(err);
    if (++st.tries <= 3) { setStatus('Neuer Versuch ' + st.tries + ' von 3 …', 'busy'); setTimeout(() => retry(dev), 2000 * st.tries); return; }
    st.tries = 0; waitForAdvert(dev);
  }
}
async function waitForAdvert(dev) {
  showConnect();
  if (!dev.watchAdvertisements) { setStatus('Nicht erreichbar – zum Verbinden tippen', 'err'); return; }
  if (abortWait) abortWait.abort();
  abortWait = new AbortController();
  const ctl = abortWait;
  setStatus('Warte auf ' + (dev.name || 'Gerät') + ' …', 'busy');
  dev.addEventListener('advertisementreceived', () => { ctl.abort(); retry(dev); }, { once: true });
  try { await dev.watchAdvertisements({ signal: ctl.signal }); }
  catch (err) { console.warn(err); setStatus('Nicht erreichbar – zum Verbinden tippen', 'err'); }
}
// Das vom Browser gemerkte Gerät, falls getDevices() verfügbar ist
async function findSaved() {
  if (!navigator.bluetooth || !navigator.bluetooth.getDevices) return null;
  const devs = await navigator.bluetooth.getDevices(), id = sget('devId');
  return devs.find(d => d.id === id) || (devs.length === 1 ? devs[0] : null);
}
async function autoConnect() {
  try { const dev = await findSaved(); if (dev) retry(dev); else setStatus('Zum Verbinden tippen'); }
  catch (err) { console.warn(err); setStatus('Zum Verbinden tippen'); }
}
// Auswahlfenster: mit gemerktem Namen zeigt es nur dieses Gerät, mit any=true alle
async function pick(any) {
  if (!navigator.bluetooth) { setStatus('Web Bluetooth fehlt: Chrome über https:// nutzen', 'err'); return; }
  if (abortWait) abortWait.abort();
  const name = sget('devName'), byName = !any && !!name;
  const opts = byName ? { filters: [{ name }], optionalServices: [SERVICE_UUID] } : { acceptAllDevices: true, optionalServices: [SERVICE_UUID] };
  try {
    setStatus('Suche Gerät …', 'busy');
    await attach(await navigator.bluetooth.requestDevice(opts));
  } catch (err) {
    console.error(err);
    setStatus(byName && err.name === 'NotFoundError' ? 'Gemerktes Gerät nicht gefunden – „Anderes Gerät wählen“ probieren' : 'Fehler: ' + err.message, 'err');
    showConnect();
  }
}
async function connect() {
  if (!navigator.bluetooth) { setStatus('Web Bluetooth fehlt: Chrome über https:// nutzen', 'err'); return; }
  if (abortWait) abortWait.abort();
  st.tries = 0;
  try {
    setStatus('Suche gemerktes Gerät …', 'busy');
    const dev = await findSaved();
    if (dev) { retry(dev); return; }
  } catch (err) { console.warn(err); }
  pick(false);
}
document.addEventListener('pointerdown', () => {
  try { st.ctx = st.ctx || new (window.AudioContext || window.webkitAudioContext)(); st.ctx.resume(); } catch {}
});

$('connect').addEventListener('click', connect);
$('pick').addEventListener('click', () => pick(true));
$('stopAlarm').addEventListener('click', stopAlarm);
$('hero').addEventListener('click', () => { if (st.ringTimer) stopAlarm(); });
$('soundBtn').addEventListener('click', () => setSound(!st.sound, true));
$('minus').addEventListener('click', () => setTarget(st.target - 1));
$('plus').addEventListener('click', () => setTarget(st.target + 1));
$('offC').addEventListener('change', e => store.set('offC', e.target.value));
$('offA').addEventListener('change', e => store.set('offA', e.target.value));
$('copyLog').addEventListener('click', async () => {
  const csv = 'zeit;rawKern;rawGriff;kern;griff;hex\n' + st.log.join('\n');
  try { await navigator.clipboard.writeText(csv); $('copyLog').textContent = 'Kopiert · ' + st.log.length + ' Zeilen'; }
  catch { $('copyLog').textContent = 'Kopieren nicht möglich'; }
  setTimeout(() => $('copyLog').textContent = 'Messprotokoll kopieren', 2500);
});
$('offC').value = store.get('offC', 21); $('offA').value = store.get('offA', 23);
setSound(store.get('sound', 1) === 1, false); buildStages(); setTarget(store.get('target', 60)); drawChart();
updatePick(); setInterval(updateEta, 5000);
autoConnect();
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
